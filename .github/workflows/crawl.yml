name: Auto Crawl Danang Rentals

on:
  schedule:
    # Chạy tự động mỗi ngày vào lúc 00:00 UTC (07:00 sáng giờ VN)
    - cron: '0 0 * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Crawler Pipeline
        run: |
          python crawler_pipeline.py

      - name: Commit and Push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/database.json
          git commit -m "chore(data): auto-update rental database [skip ci]" || echo "No changes to commit"
          git push
